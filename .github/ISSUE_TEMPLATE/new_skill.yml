name: Propose a new R skill
description: Suggest wrapping an R package on CRAN as an agent-callable skill in this hub. The project's scope is R; Python and Julia external-package wrappers are out of scope (decision 2026-05-09).
title: "[skill] add wrapper for <package-name>"
labels: ["new-skill", "triage"]
body:
  - type: input
    id: package
    attributes:
      label: Upstream R package name
      placeholder: e.g. forecast, lme4, bgumbel
    validations:
      required: true

  - type: input
    id: package_url
    attributes:
      label: Upstream URL
      placeholder: https://github.com/owner/repo (or https://cran.r-project.org/package=<name>)
    validations:
      required: true

  - type: input
    id: license
    attributes:
      label: License
      placeholder: MIT / BSD / Apache-2.0 / GPL-2 / GPL-3
    validations:
      required: true

  - type: textarea
    id: functions
    attributes:
      label: Functions to expose
      description: List 3-15 functions you propose to wrap. One per line.
      placeholder: |
        forecast.HoltWinters
        forecast.Arima
        accuracy
    validations:
      required: true

  - type: textarea
    id: usecase
    attributes:
      label: Use case for an LLM agent
      description: When would an agent reach for this skill? Be concrete.
      placeholder: |
        An agent doing time-series analysis on user-provided CSVs needs
        seasonal-trend forecasts without writing per-task R code.
    validations:
      required: true

  - type: input
    id: maintainer
    attributes:
      label: Proposed maintainer
      description: Who will own the PR and respond to issues for this skill?
      placeholder: "@your-github-handle"
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: License caveats, large dependencies, planned tests, etc.
