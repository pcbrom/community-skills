name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Opt into Node.js 24 for all JavaScript-based actions in this workflow.
  # GitHub deprecated Node 20 on 2025-09-19 and will remove it from runners
  # on 2026-09-16; the flag will become the default on 2026-06-02 anyway.
  # Documentation: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install R dependencies
        run: |
          Rscript -e 'install.packages(c("jsonlite", "bgumbel"), repos="https://cloud.r-project.org")'
          Rscript -e 'cat("R version:", as.character(getRversion()), "\n")'
          Rscript -e 'cat("bgumbel version:", as.character(packageVersion("bgumbel")), "\n")'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Smoke test the R bridge directly
        run: |
          echo '{"fn":"dbgumbel","x":[-1.0,0.0,1.0],"mu":0.0,"sigma":1.0,"delta":0.5}' \
            | Rscript --vanilla skills/bgumbel/invoke.R

      - name: Run pytest
        run: pytest tests/ -v
