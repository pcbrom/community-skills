name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install R dependencies
        run: |
          Rscript -e 'install.packages(c("jsonlite", "bgumbel"), repos="https://cloud.r-project.org")'
          Rscript -e 'cat("R version:", as.character(getRversion()), "\n")'
          Rscript -e 'cat("bgumbel version:", as.character(packageVersion("bgumbel")), "\n")'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Smoke test the R bridge directly
        run: |
          echo '{"fn":"dbgumbel","x":[-1.0,0.0,1.0],"mu1":-1.0,"mu2":1.0,"delta":0.5}' \
            | Rscript --vanilla skills/bgumbel/invoke.R

      - name: Run pytest
        run: pytest tests/ -v
